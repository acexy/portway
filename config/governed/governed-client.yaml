# Portway governed client authentication record.
#
# Place this file in the directory configured by
# authentication.governed_clients_path in server.yaml.
#
# The file name is an operator-facing label and does not need to match
# client_id. ClientIDs must still be unique across all authentication records.
# All ClientIDs and Tokens must be globally unique across Shared, Governed, and
# Managed authentication records.

authentication:
  # * Required. Server-owned identity returned to the authenticated client.
  client_id: governed-client
  # * Required. Independent Token configured by the client. It must contain
  # more than 32 UTF-8 characters and remain globally unique. Prefer an
  # automatically generated 256-bit value and never commit a production Token.
  # Hot-reloading this Token disconnects only this ClientID.
  token: PORTWAY_TOKEN_REQUIRED

# * Required. Limits the complete Proxy and Forward configuration declared by
# this client. The server rejects a complete declaration set when any entry is
# outside these permissions; it never silently removes individual entries.
# Permission changes are hot-reloadable and revoke only this Governed ClientID;
# after reconnecting, the client resubmits its complete desired sets.
permissions:
  proxies:
    # A protocol is allowed only when its rule node is present. Omit the entire
    # proxies node when this client is allowed to declare Forwards only.
    tcp:
      remote_port_ranges:
        - start: 20000
          end: 20999
        - start: 22000
          end: 22099
    udp:
      remote_port_ranges:
        - start: 30000
          end: 30999
    http:
      public_schemes:
        - https
      domains:
        - app.example.com
        - "*.customer.example.com"
    # Optional Proxy-specific ceilings. Omitted fields use production-safe
    # defaults; explicit zero values are invalid. max_active_links counts only
    # Proxy Links; a separate program hard limit still covers both directions.
    limits:
      max_total: 20
      max_tcp: 10
      max_udp: 5
      max_http: 10
      max_active_links: 100

  # Governed clients receive no Forward permission unless rules are present.
  # Every rule must be a complete subset of one server-wide forwards.rules
  # entry; ranges are never clipped or combined across global rules.
  forwards:
    rules:
      - ip_range: 10.20.0.0/16
        tcp:
          port_ranges:
            - start: 5432
              end: 5432
      - ip_range: 10.30.0.53/32
        udp:
          port_ranges:
            - start: 53
              end: 53
    limits:
      # Optional Forward-specific ceilings. Omitted fields use production-safe
      # defaults; explicit zero values are invalid. max_active_links counts only
      # Forward Links; a separate program hard limit still covers both directions.
      max_total: 5
      max_tcp: 4
      max_udp: 1
      max_active_links: 20
