# Portway governed client authentication record.
#
# Place this file in the directory configured by
# authentication.governed_clients_path in server.yaml.
#
# The file name is an operator-facing label and does not need to match
# client_id. ClientIDs must still be unique across all authentication records.
# All ClientIDs and Tokens must be globally unique across Shared, Governed, and
# Managed authentication records.

authentication:
  # * Required. Server-owned identity returned to the authenticated client.
  client_id: governed-client
  # * Required. Independent Token configured by the client.
  token: PORTWAY_TOKEN_REQUIRED

# * Required. Limits the proxy configuration declared by this client.
# The server rejects the complete proxy set when any declaration is outside
# these permissions; it never silently removes individual proxies.
permissions:
  proxies:
    # A protocol is allowed only when its rule node is present.
    tcp:
      remote_port_ranges:
        - start: 20000
          end: 20999
        - start: 22000
          end: 22099
    udp:
      remote_port_ranges:
        - start: 30000
          end: 30999
    http:
      public_schemes:
        - https
      domains:
        - app.example.com
        - "*.customer.example.com"
    # Optional proxy-specific ceilings.
    limits:
      max_total: 20
      max_tcp: 10
      max_udp: 5
      max_http: 10
      max_active_links: 100

  # Governed clients receive no Forward permission unless rules are present.
  # Every rule must be a complete
  # subset of one server-wide forwards.rules entry; ranges are never clipped or
  # combined across global rules. Forward permission changes are hot-reloadable
  # and revoke the affected Governed Session and its connections.
  forwards:
    rules:
      - ip_range: 10.20.0.0/16
        tcp:
          port_ranges:
            - start: 5432
              end: 5432
      - ip_range: 10.30.0.53/32
        udp:
          port_ranges:
            - start: 53
              end: 53
    limits:
      max_total: 5
      max_tcp: 4
      max_udp: 1
      max_active_links: 20
