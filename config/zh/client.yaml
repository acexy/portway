# Portway 客户端完整配置示例。字段和值与 ../client.yaml 保持一致。
# 最新模板：https://github.com/acexy/portway/tree/main/config
# “必填”表示必须显式配置；“条件必填”只在对应条件成立时要求配置。

# 可选。最低日志级别，默认 info。可选值：trace、debug、info、warn、error。
log_level: info

# Governed/Managed 必填，必须匹配服务端 Token 记录绑定的 ClientID。
# Shared 可选；留空时为当前进程生成随机 ID。长度 1-64，可使用 ASCII
# 字母、数字、点、下划线和连字符。
client_id: ""

transport:
  # 可选。TCP 与 QUIC 共用的服务端网络地址，可填写域名或 IP，默认
  # 127.0.0.1:7000；该地址与 QUIC 证书身份相互独立。
  server_address: gateway.example.com:7000
  # 可选，默认 tcp。可选值：tcp、quic。
  type: tcp
  quic:
    # transport.type=quic 时必填，是 TLS 校验的证书身份，必须与服务端证书中的
    # DNS SAN 或 IP SAN 完全匹配。使用 "portwayd gen cert" 时，域名身份通过
    # --server-name 生成，IP 身份通过 --ip 生成。通过 IP 建立连接但使用域名
    # 校验证书时，该值可以与 server_address 中的主机不同。
    server_name: gateway.example.com
    # 可选。留空使用操作系统信任库；配置后仅信任该 CA 文件。
    # 使用内部 CA 时可填写 ./certs/root-ca.crt。
    ca_file: ""

authentication:
  # 必填。服务端根据全局唯一 Token 自动选择 Shared、Governed 或 Managed。
  # 必须包含大于 32 个 UTF-8 字符；推荐使用自动生成的 256-bit 随机值，
  # 不要使用人工构造字符串。禁止提交真实 Token。
  token: PORTWAY_TOKEN_REQUIRED

# Shared/Governed 必须至少配置一项；Managed 必须留空，由服务端下发并锁定。
# 同一 ClientID 下所有代理名称必须唯一。
proxies:
  - name: ssh
    # 必填。表示 portwayd 与 portway 之间承载的端到端代理语义，而非公网入口
    # scheme。可选值：tcp（字节流）、udp（数据报）、http（HTTP 请求）。公网 TLS
    # 在 portwayd 终止，因此不存在 https 代理类型。
    type: tcp
    # 可选，默认 127.0.0.1；也可以是客户端可访问的其他 IP。
    local_ip: 127.0.0.1
    # 必填，本地目标端口，范围 1-65535。
    local_port: 22
    # TCP/UDP 必填，HTTP 禁止配置；范围 1-65535。
    remote_port: 22022

  # 公网 HTTP/HTTPS 示例：public_schemes 显式选择允许的公网 Listener；任一声明
  # 的入口未在 portwayd 启用时，整批代理注册都会被拒绝。HTTPS 在 portwayd
  # 终止 TLS、按 SNI 选择证书，
  # 再以明文 HTTP 回源 local_ip:local_port，因此本地服务必须提供 HTTP。
  # 服务端至少启用一个 HTTP/HTTPS Listener；使用 HTTPS 时证书映射还必须覆盖该域名。
  - name: web
    type: http
    # type=http 时可选；留空或省略默认 [http]。显式值可为 http、https 且不得
    # 重复。TCP/UDP 禁止配置。
    public_schemes:
      - https
    # 必填：规范化小写 DNS 域名，不含协议、端口、路径、通配符或尾点。
    domain: app.example.com
    local_ip: 127.0.0.1
    local_port: 8080

  # UDP 示例：
  - name: dns
    type: udp
    local_ip: 127.0.0.1
    local_port: 53
    remote_port: 5353
