# Governed 服务端客户端记录完整示例，对应 ../../../config/governed/governed-client.yaml。
# 文件名只是操作者标签，无需匹配 client_id。所有独立 ClientID 和 Token 必须唯一。

authentication:
  client_id: governed-client
  # 必须包含大于 32 个 UTF-8 字符且保持全局唯一；推荐使用自动生成的 256-bit
  # 随机值。禁止提交生产 Token。热加载修改本记录 Token 时，只断开本 ClientID。
  token: PORTWAY_TOKEN_REQUIRED

# 必填。限制本客户端声明的完整 Proxy 和 Forward 配置；任一条目越权时服务端
# 拒绝完整声明集合，不会静默删除个别条目。权限变化支持热加载，只吊销当前
# Governed ClientID；客户端重连后重新提交完整期望集合。
permissions:
  proxies:
    # 协议规则节点存在即表示允许该协议。仅允许 Forward 时可省略整个 proxies。
    tcp:
      remote_port_ranges:
        - start: 20000
          end: 20999
        - start: 22000
          end: 22099
    udp:
      remote_port_ranges:
        - start: 30000
          end: 30999
    http:
      public_schemes:
        - https
      domains:
        - app.example.com
        - "*.customer.example.com"
    # 可选 Proxy 资源上限。省略字段使用面向生产的安全默认值；显式 0 非法。
    # max_active_links 只统计 Proxy Link，程序级硬上限仍同时约束两个方向。
    limits:
      max_total: 20
      max_tcp: 10
      max_udp: 5
      max_http: 10
      max_active_links: 100

  # Governed 客户端只有显式配置规则后才获得 Forward 权限。
  # 每条规则必须完整包含于 server.yaml 的某一条 forwards.rules，禁止跨全局规则
  # 拼接或自动裁剪。权限变化支持热加载，并吊销受影响 Governed Session 及其连接。
  forwards:
    rules:
      - ip_range: 10.20.0.0/16
        tcp:
          port_ranges:
            - start: 5432
              end: 5432
      - ip_range: 10.30.0.53/32
        udp:
          port_ranges:
            - start: 53
              end: 53
    # 可选 Forward 资源上限。省略字段使用面向生产的安全默认值；显式 0 非法。
    # max_active_links 只统计 Forward Link，程序级硬上限仍同时约束两个方向。
    limits:
      max_total: 5
      max_tcp: 4
      max_udp: 1
      max_active_links: 20
