# Governed 服务端客户端记录完整示例，对应 ../../../config/governed/governed-client.yaml。
# 文件名只是操作者标签，无需匹配 client_id。所有独立 ClientID 和 Token 必须唯一。

client_id: governed-client
# 必须包含大于 32 个 UTF-8 字符且保持唯一；推荐使用自动生成的 256-bit 随机值。
# 禁止提交生产 Token。
token: PORTWAY_TOKEN_REQUIRED

permissions:
  # 必填，至少一项。表示 portwayd 与 portway 之间的代理语义，而非公网入口
  # scheme；可选值：tcp、udp、http，不得重复。公网 HTTP/HTTPS 在下方单独授权。
  proxy_types:
    - tcp
    - udp
    - http

  tcp:
    # 公网 TCP 端口授权闭区间；范围 1-65535，区间不得重叠。
    remote_port_ranges:
      - start: 20000
        end: 20999
      - start: 22000
        end: 22099

  udp:
    # 公网 UDP 端口授权闭区间；范围 1-65535，区间不得重叠。
    remote_port_ranges:
      - start: 30000
        end: 30999

  http:
    # 允许 http 时可选；留空或省略默认只授权 http。显式值可为 http、https 且
    # 不得重复；客户端只能请求这里授权且已由服务端全局启用的公网 Listener。
    public_schemes:
      - https

    # 不得重复的精确域名或仅匹配一级子域名的 *.example.com；客户端仍注册具体域名。
    # HTTPS 是否可用还取决于服务端 HTTPS Listener 和 SNI 证书集合；客户端具体
    # 域名必须被证书覆盖。TLS 在 portwayd 终止，客户端本地目标仍使用明文 HTTP。
    domains:
      - app.example.com
      - "*.customer.example.com"

  # 可选配额。缺省使用下列默认值；显式值必须大于 0 且不超过硬上限。
  # 各类型代理上限不得超过 max_proxies。
  limits:
    # 默认 20，硬上限 128。
    max_proxies: 20
    # 默认 10，硬上限 128。
    max_tcp_proxies: 10
    # 默认 5，硬上限 128。
    max_udp_proxies: 5
    # 默认 10，硬上限 128。
    max_http_proxies: 10
    # Pending 与 Active Link 合计；默认 100，硬上限 512。
    max_active_links: 100
