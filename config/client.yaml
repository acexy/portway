# Portway client configuration.
#
# Field markers:
#   * Required: the field must be configured explicitly.
#   * Required when ...: the field is mandatory only under that condition.
#   Optional: the field may be omitted and uses the documented default.

# Optional. Minimum log severity. Defaults to info.
# Allowed values: trace, debug, info, warn, error.
# Use trace for detailed protocol and lifecycle diagnostics, including heartbeats.
log_level: info

# Optional. Stable identifier for this client.
# Leave empty to generate a random ID for the current process. Configure an
# explicit value when identity must survive process restarts.
# Length: 1-64 characters when configured.
# Allowed characters: ASCII letters, digits, dots, underscores, and hyphens.
client_id: ""

# Optional. Underlying client-server transport settings.
transport:
  # Optional. Server endpoint used by both TCP and QUIC.
  # Defaults to 127.0.0.1:7000. The effective value must not be empty.
  server_address: gateway.example.com:7000

  # Optional. Underlying transport type. Defaults to tcp.
  # Allowed values: tcp, quic.
  type: tcp

  # Optional when type=tcp. QUIC-specific TLS transport settings.
  quic:
    # * Required when transport.type=quic.
    # DNS name expected in the server certificate.
    server_name: gateway.example.com

    # Optional when transport.type=quic.
    # CA bundle used to verify the server certificate.
    # Leave empty to use the operating system trust store.
    # For "portwayd cert generate", configure ./certs/root-ca.crt here.
    ca_file: ""

# * Required. Portway application identity settings.
authentication:
  # * Required. Shared by TCP and QUIC. The server associates a globally unique
  # Token with shared, governed, or managed behavior automatically; the client
  # does not declare a management mode.
  # Use a cryptographically random value containing at least 32 bytes.
  # Never commit a real Token to version control.
  token: CHANGE_ME_TO_A_RANDOM_TOKEN_AT_LEAST_32_BYTES

# Optional for shared and governed clients. Managed clients must leave this
# empty because the server supplies and locks the complete proxy configuration.
# Empty means that this client registers no proxies.
# Proxy names must be unique within this ClientID across all proxy types.
proxies:
  # * Required for every proxy. Unique name using lowercase letters, digits,
  # underscores, or hyphens; length 1-64. The first character must be a
  # lowercase letter or digit.
  - name: ssh

    # * Required for every proxy. Allowed values: tcp, udp, http.
    type: tcp

    # Optional. Defaults to 127.0.0.1. It may be another IP address reachable
    # from the Portway client.
    local_ip: 127.0.0.1

    # * Required for every proxy. Local target port, range 1-65535.
    local_port: 22

    # * Required when type=tcp or type=udp. Public server port, range 1-65535.
    # Not allowed when type=http.
    remote_port: 22022

  # HTTP example:
  # - name: web
  #   type: http
  #   # * Required when type=http. Canonical lowercase DNS name without a
  #   # scheme, port, path, wildcard, IP literal, or trailing dot.
  #   domain: app.example.com
  #   # Optional. Defaults to 127.0.0.1.
  #   local_ip: 127.0.0.1
  #   # * Required for every proxy. Range 1-65535.
  #   local_port: 8080

  # UDP example:
  # - name: dns
  #   type: udp
  #   # Optional. Defaults to 127.0.0.1.
  #   local_ip: 127.0.0.1
  #   # * Required for every proxy. Range 1-65535.
  #   local_port: 53
  #   # * Required when type=udp. Public UDP port, range 1-65535.
  #   remote_port: 5353
