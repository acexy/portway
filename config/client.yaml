# Portway client configuration.
# Latest templates: https://github.com/acexy/portway/tree/main/config
#
# Field markers:
#   * Required: the field must be configured explicitly.
#   * Required when ...: the field is mandatory only under that condition.
#   Optional: the field may be omitted and uses the documented default.

# Optional. Minimum log severity. Defaults to info.
# Allowed values: trace, debug, info, warn, error.
# Use trace for detailed protocol and lifecycle diagnostics, including heartbeats.
log_level: info

# Optional. Underlying client-server transport settings.
transport:
  # Optional. Server network endpoint used by both TCP and QUIC. It may contain
  # a DNS name or IP address and is independent from QUIC certificate identity.
  # Defaults to 127.0.0.1:7000. The effective value must not be empty.
  server_address: gateway.example.com:7000

  # Optional. Underlying transport type. Defaults to tcp.
  # Allowed values: tcp, quic.
  type: tcp

  # Optional when type=tcp. QUIC-specific TLS transport settings.
  quic:
    # * Required when transport.type=quic.
    # Certificate identity verified by TLS. It must exactly match a DNS SAN or
    # IP SAN in the server certificate. When using "portwayd gen cert", use
    # --server-name for a DNS identity or --ip for an IP identity. This value
    # may differ from the host in server_address when connecting to an IP while
    # verifying a DNS identity.
    server_name: gateway.example.com

    # Optional when transport.type=quic.
    # CA bundle used exclusively to verify the server certificate.
    # Leave empty to use the operating system trust store instead.
    # For "portwayd gen cert", configure ./certs/root-ca.crt here.
    ca_file: ""

# * Required. Portway application identity settings.
authentication:
  # Required for Governed and Managed authentication; must match the ClientID
  # bound to this Token. Optional in Shared mode; empty generates a process ID.
  # Length: 1-64 using ASCII letters, digits, dots, underscores, and hyphens.
  client_id: ""

  # * Required. Shared by TCP and QUIC. The server associates a globally unique
  # Token with shared, governed, or managed behavior automatically; the client
  # does not declare a management mode.
  # Must contain more than 32 UTF-8 characters. Prefer an automatically
  # generated 256-bit value rather than a human-created string.
  # Never commit a real Token to version control.
  token: PORTWAY_TOKEN_REQUIRED

# Shared and Governed clients own this complete desired Proxy set. At least one
# Proxy or Forward is required across both collections. Managed clients must
# leave both collections empty because the server supplies and locks them.
# Names must be unique across all Proxies and Forwards for this ClientID.
proxies:
  # * Required for every proxy. Unique name using lowercase letters, digits,
  # underscores, or hyphens; length 1-64. The first character must be a
  # lowercase letter or digit.
  - name: ssh

    # * Required for every proxy. Selects the end-to-end proxy semantics
    # carried between portwayd and portway, not the public listener scheme.
    # Allowed values: tcp (byte stream), udp (datagram), http (HTTP request).
    # There is no https proxy type because public TLS terminates at portwayd.
    type: tcp

    # Optional. Defaults to 127.0.0.1. It may be another IP address reachable
    # from the Portway client.
    local:
      ip: 127.0.0.1
      # * Required for every proxy. Local target port, range 1-65535.
      port: 22

    public:
      # * Required when type=tcp or type=udp. Public server port, range 1-65535.
      port: 22022

  # HTTP/HTTPS public entry example. public_schemes explicitly selects the
  # allowed public listeners; every requested listener must be enabled on
  # portwayd or the complete proxy registration is rejected. For HTTPS, portwayd
  # terminates TLS, selects a configured SNI certificate, and forwards plain
  # HTTP to local_ip:local_port; the local service must therefore speak HTTP.
  # The server must enable at least one HTTP/HTTPS listener, and HTTPS access
  # additionally requires a certificate mapping that covers this exact domain.
  - name: web
    type: http
    local:
      ip: 127.0.0.1
      port: 8080
    public:
      # Optional when type=http. Defaults to [http] when empty or omitted.
      # Explicit values must be unique and may be http or https.
      # Not allowed for tcp or udp.
      schemes:
        - https
      # * Required when type=http. Canonical lowercase DNS name.
      domain: app.example.com

  # UDP example:
  - name: dns
    type: udp
    # Optional. Defaults to 127.0.0.1.
    local:
      ip: 127.0.0.1
      port: 53
    public:
      port: 5353

# Shared and Governed clients own this complete desired Forward set. At least
# one Proxy or Forward is required across both collections. Managed clients
# must leave both collections empty because the server supplies and locks them.
# A Forward accepts traffic on portway and carries it through the authenticated
# tunnel to an IP:port reachable from portwayd. Shared and Governed clients own
# this complete set. Managed clients must not configure it locally because the
# server supplies it. The client reads its YAML only at process startup; local
# configuration changes, including Forward changes, require a client restart.
# Names are unique across Proxies and Forwards for the same client.
forwards:
  - name: database
    # * Required. Allowed values: tcp, udp.
    type: tcp
    # * Required. Explicit client-side listening IP; hostnames are not
    # accepted. Bind loopback unless other machines must use this entry.
    listen:
      ip: 127.0.0.1
      # * Required. Client-side listening port, range 1-65535.
      port: 15432
    # * Required. Explicit target IP reachable from portwayd; hostnames are
    # not accepted. The server checks this IP and port against its global
    # Forward allowlist and any Governed client permissions.
    target:
      ip: 10.20.1.15
      # * Required. Server-side target port, range 1-65535.
      port: 5432
