# Portway managed client authentication record.
#
# Place this file in the directory configured by
# authentication.managed_clients_path in server.yaml.
#
# The file name is an operator-facing label and does not need to match
# client_id. ClientIDs must still be unique across all authentication records.
# All ClientIDs and Tokens must be globally unique across Shared, Governed, and
# Managed authentication records.

authentication:
  # * Required. Server-owned identity returned to the authenticated client.
  client_id: managed-client
  # * Required. Independent Token configured by the client.
  token: PORTWAY_TOKEN_REQUIRED

# Optional Managed Forward permission boundary.
# Managed Forward targets always remain inside server.yaml forwards.rules. This
# optional rule set may narrow that global boundary further, but never expand
# it. Omit it to use only the global boundary. Rules are allowed only when this
# record contains at least one configuration.forwards entry. Rule and Forward
# changes are hot-reloadable with the Managed Prepare/Activate rollout.
permissions:
  forwards:
    rules:
      - ip_range: 10.40.0.0/16
        tcp:
          port_ranges:
            - start: 5432
              end: 5432

# * Required. Complete server-owned client configuration.
# A managed client must not define local proxies in client.yaml; it receives
# this complete list after authentication and cannot override it.
configuration:
  # * Required. Monotonically increasing configuration revision.
  # Allowed values: positive integers greater than zero.
  revision: 1

  # Optional. Complete desired proxy set. Defaults to empty, which means that
  # this client exposes no proxies. Hard maximum: 128 entries across TCP, UDP,
  # and HTTP. HTTPS uses the same type=http entries and is not a fourth proxy
  # type. Names must be unique within this record. Exceeding the hard
  # maximum prevents server startup or rejects the hot-reload candidate.
  # Across all Managed records, TCP remote ports, UDP remote ports, and HTTP
  # domains must each be globally unique. TCP and UDP may use the same numeric
  # port because they are different network protocols. These resources remain
  # reserved for this Managed ClientID even while the client is offline.
  proxies:
    # TCP example.
    - name: ssh
      # * Required. Selects end-to-end proxy semantics carried between
      # portwayd and portway, not a public listener scheme. Allowed values:
      # tcp, udp, http. Public TLS terminates at portwayd, so there is no https
      # proxy type.
      type: tcp
      # Optional. Defaults to 127.0.0.1. It may be another IP address reachable
      # by the client.
      local:
        ip: 127.0.0.1
        port: 22
      public:
        port: 22022

    # UDP example.
    - name: dns
      type: udp
      # Optional. Defaults to 127.0.0.1.
      local:
        ip: 127.0.0.1
        port: 53
      public:
        port: 5353

    # HTTP/HTTPS public entry example. This one domain binding is served by
    # every enabled public HTTP or HTTPS listener. HTTPS additionally requires
    # the server SNI certificate set to cover this domain. TLS terminates at
    # portwayd, which always forwards plain HTTP to the managed local target.
    - name: web
      type: http
      # Optional for http. Empty or omitted defaults to [http]. Explicit values
      # must be unique and may be http or https. Every requested listener must
      # be enabled globally. Not allowed for tcp or udp.
      local:
        ip: 127.0.0.1
        port: 8080
      public:
        schemes:
          - https
        domain: app.example.com

  # Complete Managed Forward set. The client must not define local forwards.
  # Names are unique across this record's proxies and forwards. listen remains
  # client-side; target is checked
  # against the server-wide and optional Managed rule sets. Changing or removing
  # an entry uses Prepare/Activate and automatically closes affected connections.
  forwards:
    - name: database
      # * Required. Allowed values: tcp, udp.
      type: tcp
      # * Required. Explicit client-side listening IP; no hostname.
      listen:
        ip: 127.0.0.1
        # * Required. Range 1-65535.
        port: 15432
      # * Required. Explicit IP reachable from portwayd; no hostname.
      target:
        ip: 10.40.1.20
        # * Required. Range 1-65535.
        port: 5432
